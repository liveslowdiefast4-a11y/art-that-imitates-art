name: PR1 dependency probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: probe / ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        case:
          - full
          - full-legacy
          - production
          - lint-stack
          - test-stack
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - if: matrix.case == 'full'
        run: npm install --ignore-scripts --no-audit --no-fund
      - if: matrix.case == 'full-legacy'
        run: npm install --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - if: matrix.case == 'production'
        run: npm install --ignore-scripts --no-audit --no-fund --omit=dev
      - if: matrix.case == 'lint-stack'
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false eslint@9.39.5 eslint-config-next@16.3.8 typescript@6.0.3
      - if: matrix.case == 'test-stack'
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false vitest@5.0.3 @vitest/coverage-v8@5.0.3 typescript@6.0.3
