name: PR1 substrate

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify / ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        gate: [test, typecheck, lint, coverage, build, audit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - if: matrix.gate == 'test'
        run: npm run test
      - if: matrix.gate == 'typecheck'
        run: npm run typecheck
      - if: matrix.gate == 'lint'
        run: npm run lint
      - if: matrix.gate == 'coverage'
        run: npm run test:coverage
      - if: matrix.gate == 'build'
        run: npm run build
      - if: matrix.gate == 'audit'
        run: npm audit --audit-level=high
