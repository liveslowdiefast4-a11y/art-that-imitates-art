name: PR1 substrate

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run verification gates
        id: gates
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > ci-diagnostics.txt
          failed=0
          run_gate() {
            label="$1"
            shift
            echo "===== $label =====" >> ci-diagnostics.txt
            "$@" >> ci-diagnostics.txt 2>&1
            code=$?
            echo "$label exit=$code" >> ci-diagnostics.txt
            echo >> ci-diagnostics.txt
            if [ "$code" -ne 0 ]; then
              failed=1
            fi
          }

          run_gate install npm install --ignore-scripts --no-audit --no-fund
          if [ "$failed" -eq 0 ]; then
            run_gate test npm run test
            run_gate typecheck npm run typecheck
            run_gate lint npm run lint
            run_gate coverage npm run test:coverage
            run_gate build npm run build
            run_gate audit npm audit --audit-level=high
          fi

          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr1-ci-diagnostics
          path: ci-diagnostics.txt
          retention-days: 1
      - name: Enforce gates
        if: steps.gates.outputs.failed != '0'
        run: exit 1
