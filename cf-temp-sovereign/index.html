<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="Sovereign Cloud — local-first, zero-paid-inference AI.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <title>Sovereign Cloud</title>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">ZERO-COST SOVEREIGN MODE</p>
        <h1>Sovereign Cloud</h1>
      </div>
      <div id="status" class="status">Starting…</div>
    </header>

    <section class="panel">
      <div class="meter">
        <div>
          <strong>Cost invariant</strong>
          <span>$0 paid inference allowed</span>
        </div>
        <div>
          <strong>Execution</strong>
          <span id="engine">Detecting device…</span>
        </div>
      </div>
      <div id="progress" class="progress" hidden>
        <div id="progressBar"></div>
      </div>
      <p id="detail" class="detail">The app will prefer on-device inference and will never silently fall back to a paid model.</p>
    </section>

    <section id="chat" class="chat" aria-live="polite"></section>

    <form id="composer" class="composer">
      <textarea id="prompt" rows="3" placeholder="Message Sovereign Cloud…" required></textarea>
      <button id="send" type="submit">Send</button>
    </form>

    <section class="controls">
      <button id="installModel" type="button">Prepare local AI</button>
      <button id="clearChat" type="button">Clear chat</button>
      <span id="network">Network: checking…</span>
    </section>

    <details class="policy">
      <summary>Zero-cost policy</summary>
      <pre id="policyText"></pre>
    </details>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
